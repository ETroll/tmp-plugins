# Runs on every pull request that touches a plugin. Reads the registry references in
# each plugin.json, replaces skills/<name>/ with the registry version at the pinned
# commit, and commits the result back to the PR branch. The reviewer then sees the
# complete plugin package, with the skills exactly as they are in the registry.
#
# main is branch-protected: nothing lands without a PR, and "Check vendored skills"
# (check-skills.yml) is a required status check, so an unsynced or hand-edited skill
# cannot be merged.
name: Sync registry skills

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "plugins/**"

concurrency:
  group: sync-skills-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Pushing back requires the PR branch to live in this repository, not a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # A GitHub App installed on both the marketplace and the registry. Its token
      # (a) can read the registry and (b) triggers workflows when it pushes, which
      # GITHUB_TOKEN deliberately does not. Without (b) the required check would never
      # run against the commit this job creates.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.SKILL_REGISTRY_APP_ID }}
          private-key: ${{ secrets.SKILL_REGISTRY_APP_KEY }}
          repositories: plugin-marketplace,akerbp-skill-registry

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: AkerBP/skill-sync-action@v1
        id: sync
        with:
          mode: sync
          plugins-glob: "plugins/*/plugin.json"
          registry-token: ${{ steps.app-token.outputs.token }}

      - name: Commit synced skills to the PR branch
        if: steps.sync.outputs.changed == 'true'
        env:
          # "append" adds a commit; "amend" folds the sync into the PR's last commit
          # and force-pushes. Append keeps the contributor's history intact and is
          # the safer default.
          COMMIT_MODE: append
        run: |
          git config user.name "akerbp-skill-sync[bot]"
          git config user.email "akerbp-skill-sync[bot]@users.noreply.github.com"
          git add -A plugins
          if [ "$COMMIT_MODE" = "amend" ]; then
            git commit --amend --no-edit
            git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            git commit -m "chore: sync registry skills"$'\n\n'"${{ steps.sync.outputs.changed-plugins }}"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
