# Required status check on main. Passes only when every referenced skill is present,
# at the pinned commit, and byte-identical to the registry. Runs on every PR head,
# including the commit the sync workflow pushes, so the final reviewed state is the
# state that is verified.
name: Check vendored skills

on:
  pull_request:
    paths:
      - "plugins/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: AkerBP/skill-sync-action@v1
        with:
          mode: check
          plugins-glob: "plugins/*/plugin.json"
